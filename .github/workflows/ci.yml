name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dia-08-mcp

permissions:
  contents: read

jobs:
  test-and-build:
    name: Tests and Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build --tag mini-inventario:ci .
